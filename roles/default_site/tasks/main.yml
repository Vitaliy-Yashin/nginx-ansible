---
- name: Set default
  ansible.builtin.template:
    src: default.j2
    dest: "/etc/nginx/sites-available/default"
  notify: reload nginx

- name: Set link default
  ansible.builtin.file:
    src: '/etc/nginx/sites-available/default'
    dest: '/etc/nginx/sites-enabled/default'
    state: link
  notify: reload nginx